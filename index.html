<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin | Portfolio Informatica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0305;
            --bg-alt: #140508;
            --surface: #1f080d;
            --surface-hover: #2b0b12;
            --text-main: #fff5f6;
            --text-muted: #d6a8af;
            --accent: #ff2a4b;
            --accent-dark: #9f1239;
            --border: rgba(255, 42, 75, 0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(13, 3, 5, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .brand span { color: var(--accent); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--accent); }

        .nav-links .btn-stage {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            padding: 0.55rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 42, 75, 0.3);
        }

        .nav-links .btn-stage:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        /* SEZIONI TEMATICHE */
        .theme-section {
            padding: 5rem 8%;
            border-bottom: 1px solid var(--border);
        }

        .theme-dark {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 85% 20%, rgba(255, 42, 75, 0.12), transparent 45%);
        }

        .theme-alt {
            background-color: var(--bg-alt);
            background-image: radial-gradient(circle at 15% 80%, rgba(159, 18, 57, 0.15), transparent 45%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .theme-header { margin-bottom: 2.5rem; }

        .theme-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: block;
            margin-bottom: 0.4rem;
        }

        .theme-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* HERO */
        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
            align-items: center;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 3.8rem);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 1.2rem;
        }

        h1 span {
            background: linear-gradient(135deg, #ff3355, #ff99a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 2rem;
            max-width: 520px;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            padding: 0.85rem 1.8rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(255, 42, 75, 0.35);
            transition: transform 0.2s;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.85rem 1.8rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary:hover { background: var(--surface-hover); }

        .terminal {
            background: #100306;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .terminal-bar {
            background: #1f080d;
            padding: 0.7rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-body {
            padding: 1.5rem;
            color: var(--text-muted);
        }

        .terminal-body .cmd { color: var(--accent); }
        .terminal-body .val { color: #ffccd3; }

        /* SKILLS GRID */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            transition: transform 0.25s, border-color 0.25s;
        }

        .skill-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }

</body>
</html>
